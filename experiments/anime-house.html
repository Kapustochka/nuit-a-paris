<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuit à Paris — Anime House Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152f;color:#f9e6cb;font:14px system-ui,sans-serif}
canvas{display:block;touch-action:none}
.panel{position:fixed;top:14px;left:14px;z-index:2;max-width:290px;padding:14px 17px;background:#151b3dd9;border:1px solid #a58f9a66;border-radius:12px;backdrop-filter:blur(8px)}
h1{font:italic 600 22px Georgia,serif;margin:0 0 7px}.panel p{margin:5px 0 10px;line-height:1.4;color:#d8d5e8}
button{background:#7a415c;border:1px solid #d8a38f;color:white;border-radius:8px;padding:8px 12px;cursor:pointer}
a{color:#ffd7a2}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#141a36c9;padding:8px 13px;border-radius:99px;white-space:nowrap;font-size:12px}
@media(max-width:650px){.panel{top:8px;left:8px;right:8px;max-width:none;padding:9px 12px}.panel p{display:none}.hint{font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div class="panel"><h1>Maison des Rêves</h1><p>Эксперимент: полностью процедурный парижский дом в painted-anime стиле. Без GLB и внешних текстур.</p><button id="light">Свет: ночь</button> <button id="roof">Крыша: мансарда</button> <p><a href="../">← Основная игра</a></p></div>
<div class="hint">Мышь / палец — вращать · колесо / щипок — приближать</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();
scene.background=new THREE.Color('#171d42');
scene.fog=new THREE.Fog('#171d42',27,62);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,120);
camera.position.set(13,11,22);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,8.3,0);controls.enableDamping=true;controls.minDistance=9;controls.maxDistance=48;
controls.maxPolarAngle=Math.PI*.49;controls.update();
scene.add(new THREE.HemisphereLight(0x8da8ff,0x453244,2.1));
const moon=new THREE.DirectionalLight(0xb2c8ff,2.3);moon.position.set(-8,20,12);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);moon.shadow.camera.left=-15;moon.shadow.camera.right=15;moon.shadow.camera.top=24;moon.shadow.camera.bottom=-15;scene.add(moon);
const warm=new THREE.PointLight(0xffbc75,65,22,1.7);warm.position.set(0,5,8);scene.add(warm);
const mat=(color,roughness=1,emissive=0x000000,intensity=0)=>new THREE.MeshStandardMaterial({color,roughness,emissive,emissiveIntensity:intensity});
const wall=mat('#e3c7b6'),wallSide=mat('#bca9b8'),stone=mat('#a49bb2'),stoneBright=mat('#e9d4c6'),slate=mat('#343a61'),slateLight=mat('#565b80'),dark=mat('#272442'),ink=mat('#34304d'),metal=mat('#413b56'),gold=mat('#f6b76e',.8,0x9d4b16,.3),windowDark=mat('#252946',.3),windowLit=mat('#ffd19a',.45,0xff9d4d,1.7),windowDim=mat('#aa89a4',.45,0x33294a,.3),plum=mat('#783d5c'),awningEdge=mat('#e5b9a5'),green=mat('#5c806f'),leaf=mat('#75967a'),flower=mat('#d99bb0');
const house=new THREE.Group();scene.add(house);
function box(w,h,d,x,y,z,m,parent=house){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}
function plane(w,h,x,y,z,m,parent=house){const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);o.position.set(x,y,z);parent.add(o);return o;}
function text(label,w,h,x,y,z,background,foreground,size=80){const c=document.createElement('canvas');c.width=768;c.height=192;const g=c.getContext('2d');g.fillStyle=background;g.fillRect(0,0,768,192);g.strokeStyle='#d6a884';g.lineWidth=9;g.strokeRect(12,12,744,168);g.fillStyle=foreground;g.textAlign='center';g.textBaseline='middle';g.font='bold '+size+'px Georgia';g.fillText(label,384,98);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;plane(w,h,x,y,z,new THREE.MeshBasicMaterial({map:t}));}
box(9.2,14.8,6.3,0,7.4,0,wall);
box(.15,14.8,6.5,-4.65,7.4,0,wallSide);box(.15,14.8,6.5,4.65,7.4,0,wallSide);
box(9.5,.55,6.55,0,.36,0,stone);
for(const y of [3.5,6.35,9.2,12.05,14.65])box(9.55,.17,6.6,0,y,0,stoneBright);
for(const x of [-4.28,4.28])box(.24,14.5,.16,x,7.3,3.25,stoneBright);
for(const x of [-2.75,0,2.75]){
  for(let level=0;level<4;level++){
    const y=4.65+level*2.85;
    box(1.58,2.03,.09,x,y,3.22,stoneBright);
    box(1.29,1.72,.1,x,y,3.3,ink);
    const lit=(level+x/2.75+4)%3!==1;
    box(1.14,1.58,.05,x,y,3.37,lit?windowLit:windowDim);
    box(.075,1.73,.1,x,y,3.43,stoneBright);
    box(1.28,.075,.1,x,y+.12,3.44,stoneBright);
    box(1.65,.16,.48,x,y-1.12,3.5,stoneBright);
    if(level>0){
      box(1.7,.07,.08,x,y-1.0,3.87,metal);
      for(let j=-2;j<=2;j++)box(.045,.65,.05,x+j*.32,y-.65,3.88,metal);
      box(1.7,.07,.07,x,y-.33,3.87,metal);
    }
    if(level===1 && x!==0){
      box(.55,.3,.43,x-.44,y-1.0,3.72,stone);
      for(let j=0;j<3;j++){
        const o=new THREE.Mesh(new THREE.IcosahedronGeometry(.24,0),j%2?flower:leaf);
        o.position.set(x-.65+j*.19,y-.64,3.77);house.add(o);
      }
    }
  }
}
box(9.3,3.25,.25,0,1.85,3.2,dark);
for(const x of [-2.8,2.8]){
 box(2.35,2.4,.08,x,1.75,3.38,stoneBright);
 box(2.12,2.17,.06,x,1.78,3.46,windowLit);
 box(.07,2.2,.1,x,1.78,3.53,ink);
 box(2.2,.07,.1,x,1.78,3.54,ink);
 box(2.5,.18,.55,x,2.95,3.75,plum);
}
box(1.7,2.65,.14,0,1.55,3.45,plum);box(1.38,2.37,.08,0,1.55,3.55,dark);
box(.08,2.1,.08,0,1.55,3.61,gold);
box(.13,.13,.13,.48,1.45,3.68,gold);
text('BOULANGERIE DES RÊVES',6.9,.76,0,3.46,3.62,'#60304d','#ffe3b5',57);
for(const x of [-2.8,2.8]){const aw=box(2.65,.12,1.35,x,3.18,4.02,plum);aw.rotation.x=-.12;for(let i=-2;i<=2;i++)box(.15,.12,1.36,x+i*.52,3.22,4.03,awningEdge);}
const roof=new THREE.Group();house.add(roof);
const roofShape=new THREE.Shape();roofShape.moveTo(-4.7,14.8);roofShape.lineTo(-3.2,17.5);roofShape.lineTo(3.2,17.5);roofShape.lineTo(4.7,14.8);roofShape.closePath();
const roofGeo=new THREE.ExtrudeGeometry(roofShape,{depth:6.5,bevelEnabled:false});
roofGeo.translate(0,0,-3.25);
const roofMesh=new THREE.Mesh(roofGeo,slate);roofMesh.castShadow=true;roof.add(roofMesh);
box(6.65,.19,6.75,0,17.56,0,slateLight,roof);
for(const x of [-2.5,0,2.5]){
 box(1.35,1.45,.82,x,16.12,3.08,slateLight,roof);
 box(1.08,1.17,.06,x,16.05,3.54,windowLit,roof);
 box(.09,1.24,.09,x,16.06,3.59,ink,roof);
 box(1.58,.2,1.1,x,16.9,3.1,slate,roof);
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),mat('#4a4a68'));ground.rotation.x=-Math.PI/2;ground.position.y=-.05;ground.receiveShadow=true;scene.add(ground);
for(let i=-12;i<=12;i++){const line=box(90,.015,.03,0,.005,i*1.1,stone);line.castShadow=false;}
for(let i=-20;i<=20;i++){const line=box(.03,.015,30,i*1.1,.007,0,stone);line.castShadow=false;}
for(const x of [-5.9,5.9]){const pole=box(.12,4.1,.12,x,2.05,5.1,metal);box(.4,.4,.4,x,4.25,5.1,gold);}
let day=false;
document.querySelector('#light').onclick=()=>{day=!day;scene.background.set(day?'#93a5ca':'#171d42');scene.fog.color.copy(scene.background);moon.intensity=day?3.4:2.3;warm.intensity=day?0:65;renderer.toneMappingExposure=day?1.2:1.45;document.querySelector('#light').textContent=day?'Свет: день':'Свет: ночь';};
let mansard=true;
document.querySelector('#roof').onclick=()=>{mansard=!mansard;roof.visible=mansard;document.querySelector('#roof').textContent=mansard?'Крыша: мансарда':'Крыша: скрыта';};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body></html>
