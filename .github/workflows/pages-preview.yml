name: Publish game and PR preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to preview (default 4)'
        required: false
        default: '4'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out production game
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Check out preview PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number || '4' }}/head
          path: preview

      - name: Assemble site without changing main
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number || '4' }}
        run: |
          set -euo pipefail
          mkdir -p _site/previews/"pr-${PR_NUMBER}"
          rsync -a --exclude='.git' --exclude='.github' production/ _site/
          rsync -a --exclude='.git' --exclude='.github' preview/ "_site/previews/pr-${PR_NUMBER}/"
          test -f _site/index.html
          test -f "_site/previews/pr-${PR_NUMBER}/index.html"
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
